name: Render auto-deploy

on:
  push:
    branches: [main, fixes]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            SERVICE_ID="srv-d7aitn1r0fns738gobtg"  # unified (production)
            SERVICE_NAME="unified"
          else
            SERVICE_ID="srv-d7amc45m5p6s73bf23k0"  # unified-fixes (staging)
            SERVICE_NAME="unified-fixes"
          fi

          echo "Triggering deploy on $SERVICE_NAME ($SERVICE_ID) for commit ${{ github.sha }}"

          response=$(curl -sS -w "\n%{http_code}" -X POST \
            "https://api.render.com/v1/services/$SERVICE_ID/deploys" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"clearCache": "do_not_clear"}')

          body=$(echo "$response" | sed '$d')
          status=$(echo "$response" | tail -n1)

          echo "HTTP $status"
          echo "$body" | python3 -m json.tool 2>/dev/null || echo "$body"

          case "$status" in
            200|201|202)
              echo "Deploy queued successfully"
              ;;
            *)
              echo "Deploy trigger failed (HTTP $status)"
              exit 1
              ;;
          esac
