  <style>
    :root {
      --bg: #FFFFFF;
      --bg-alt: #F8FAFC;
      --bg-el: #FFFFFF;
      --bg-hov: #F8FAFC;
      --bg-sel: #EFF6FF;
      --bd: #E2E8F0;
      --bd-s: #CBD5E1;
      --tx1: #0F172A;
      --tx2: #475569;
      --tx3: #94A3B8;
      --blue: #2563EB;
      --blue-h: #1D4ED8;
      --blue-bg: rgba(37,99,235,.1);
      --green: #22C55E;
      --green-text: #16A34A;
      --amber: #F59E0B;
      --amber-text: #D97706;
      --red: #EF4444;
      --red-text: #DC2626;
      --sh: 0 1px 2px rgba(0,0,0,.05);
      --sh-md: 0 4px 6px -1px rgba(0,0,0,.1), 0 2px 4px -2px rgba(0,0,0,.1);
      --radius: 8px;
      --radius-lg: 12px;
      --transition: 0.2s ease;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 14px;
      color: var(--tx1);
      background: var(--bg);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
  </style>
  {% block extra_styles %}{% endblock %}

<body>
  {% block content %}{% endblock %}
</body>
