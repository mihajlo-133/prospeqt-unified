<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Prospeqt{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="icon" type="image/png" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAEAAAABACAMAAACdt4HsAAAAHlBMVEVMaXEAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAABKvP01AAAACXRSTlMA46EiQoTCEGeetEsFAAAACXBIWXMAAAsTAAALEwEAmpwYAAABWElEQVR42u2Xyw7EIAhFS1Us///Dk3bqGywyq0l6t+oJeIngtk3lcXebXW4nIjisx2MAumRE+Pv4KUMeDqlRcIvRU6+lPA4gRqANwiMJUl3FZZ0kCGrrRMShts6Qh0NSSbCUsW4pjwNoQYOlHmlR3VVI5qGTIgtRkQJ46W6Qu8cwVE0UwrvATQLcxjrJpj5yOZYN2RaXN6KXMkxxxX3Pq1VQ342M0Xd4CXzWfA0oEbvA3HAq1Ay+cmoB5ZgTi93HpuZ7gPbRyb4OAN2jU66TATw/OnXNswDC+fmmUlgAvIAX8AL+AdD272VA36NWAUPzWwMw/XsFELnurQcIo5caII1eBQBTgDi8VENjFeIIkMYkz484SsDYBtNooAOw/fseDRSAfvrIQQQVAPx0VH8CAD99lDxwDkDDL1CRvBJg/UFOrdMD0P4FfrJOAQBz9F/ATx/48zmYLn8A5oQ0r5uSKKoAAAAASUVORK5CYII=">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/htmx.org@2.0.4/dist/htmx.min.js"></script>
  <script>htmx.config.timeout = 180000;</script>
  <style>
    :root {
      --bg: #FFFFFF;
      --bg-alt: #F8FAFC;
      --bg-el: #FFFFFF;
      --bg-hov: #F8FAFC;
      --bg-sel: #EFF6FF;
      --bd: #E2E8F0;
      --bd-s: #CBD5E1;
      --tx1: #0F172A;
      --tx2: #475569;
      --tx3: #94A3B8;
      --blue: #2563EB;
      --blue-h: #1D4ED8;
      --blue-bg: rgba(37,99,235,.1);
      --green: #22C55E;
      --green-text: #16A34A;
      --amber: #F59E0B;
      --amber-text: #D97706;
      --red: #EF4444;
      --red-text: #DC2626;
      --red-card-bg: rgba(239,68,68,.04);
      --red-bg-md: rgba(239,68,68,.08);
      --red-bg: rgba(239,68,68,.06);
      --red-bd: rgba(239,68,68,.2);
      --red-tint: rgba(239,68,68,.025);
      --amber-card-bg: rgba(245,158,11,.04);
      --amber-bg: rgba(245,158,11,.06);
      --amber-bd: rgba(245,158,11,.2);
      --amber-tint: rgba(245,158,11,.025);
      --green-card-bg: rgba(34,197,94,.04);
      --green-tint: rgba(34,197,94,.015);
      --blue-bd: rgba(37,99,235,.2);
      --purple: #8B5CF6;
      --sh: 0 1px 2px rgba(0,0,0,.05);
      --sh-md: 0 4px 6px -1px rgba(0,0,0,.1), 0 2px 4px -2px rgba(0,0,0,.1);
      --sh-lg: 0 10px 15px -3px rgba(0,0,0,.1), 0 4px 6px -4px rgba(0,0,0,.1);
      --radius-xs: 3px;
      --radius-sm: 6px;
      --radius: 8px;
      --radius-md: 8px;
      --radius-lg: 12px;
      --transition: 0.2s ease;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 14px;
      color: var(--tx1);
      background: var(--bg);
      line-height: 1.5;
      font-variant-numeric: tabular-nums;
      -webkit-font-smoothing: antialiased;
    }

    /* ============================================================
       Sidebar layout — mobile-first
       ============================================================ */

    /* Logo icon (flame) — used in sidebar header */
    .logo-icon {
      width: 28px;
      height: 28px;
      flex-shrink: 0;
      border-radius: 6px;
      background: linear-gradient(180deg, #FFEAA9 0%, #FFD348 35%, #FF9B1C 65%, #FF4A00 100%);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .logo-icon svg { width: 16px; height: 16px; }

    /* Sidebar — mobile: hidden off-screen left, slides in as overlay */
    .sidebar {
      position: fixed;
      left: -280px;
      top: 0;
      bottom: 0;
      width: 280px;
      background: var(--bg-el);
      border-right: 1px solid var(--bd);
      display: flex;
      flex-direction: column;
      transition: left var(--transition);
      z-index: 200;
      overflow-y: auto;
    }
    .sidebar.open { left: 0; }

    /* Dim backdrop — only visible on mobile when sidebar is open */
    .sidebar-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.4);
      z-index: 199;
    }
    .sidebar-backdrop.open { display: block; }

    /* Hamburger button — mobile only */
    .sidebar-hamburger {
      display: flex;
      align-items: center;
      justify-content: center;
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 201;
      width: 44px;
      height: 44px;
      background: var(--bg-el);
      border: 1px solid var(--bd);
      border-radius: var(--radius);
      cursor: pointer;
      color: var(--tx2);
      font-size: 18px;
      line-height: 1;
      transition: background var(--transition), border-color var(--transition);
    }
    .sidebar-hamburger:hover {
      background: var(--bg-hov);
      border-color: var(--bd-s);
      color: var(--tx1);
    }

    /* Sidebar header (logo + wordmark) */
    .sidebar-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 20px 16px 16px;
      text-decoration: none;
      color: var(--tx1);
    }
    .sidebar-wordmark {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -.03em;
      font-family: 'Inter', sans-serif;
      color: var(--tx1);
    }

    /* MENU section label */
    .sidebar-menu-label {
      padding: 8px 16px 4px;
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--tx3);
      font-family: 'Inter', sans-serif;
    }

    /* Nav links */
    .sidebar-link {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 16px;
      font-size: 14px;
      font-weight: 500;
      color: var(--tx2);
      text-decoration: none;
      transition: background var(--transition), color var(--transition);
      border-left: 3px solid transparent;
      font-family: 'Inter', sans-serif;
    }
    .sidebar-link:hover {
      background: var(--bg-hov);
      color: var(--tx1);
    }
    .sidebar-link.active {
      background: var(--bg-sel);
      color: var(--blue);
      border-left-color: var(--blue);
    }
    .sidebar-link:focus-visible {
      outline: 2px solid var(--blue);
      outline-offset: -2px;
    }

    /* Spacer pushes Settings to bottom */
    .sidebar-spacer { flex-grow: 1; }

    /* Settings link at bottom */
    .sidebar-link-bottom {
      border-top: 1px solid var(--bd);
      margin-top: 8px;
    }

    /* Tablet tooltip — CSS-only, no JS */
    .sidebar-link[data-tooltip] { position: relative; }
    .sidebar-link[data-tooltip]::after {
      content: attr(data-tooltip);
      position: absolute;
      left: 100%;
      top: 50%;
      transform: translateY(-50%);
      margin-left: 10px;
      background: var(--tx1);
      color: var(--bg);
      font-size: 12px;
      font-weight: 500;
      padding: 4px 10px;
      border-radius: var(--radius-sm);
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      transition: opacity .15s;
      z-index: 300;
    }
    .sidebar-link[data-tooltip]:hover::after,
    .sidebar-link[data-tooltip]:focus-visible::after { opacity: 1; }

    /* Main content area — mobile: full width (hamburger floats above) */
    .page-content {
      min-height: 100vh;
      padding-top: 56px; /* clear hamburger button on mobile */
    }

    /* Tablet ≥640px: 60px icon-only rail */
    @media (min-width: 640px) {
      .sidebar {
        left: 0;
        width: 60px;
      }
      .sidebar-backdrop { display: none !important; }
      .sidebar-hamburger { display: none; }
      .sidebar-wordmark,
      .sidebar-menu-label,
      .sidebar-link-text { display: none; }
      .sidebar-header { padding: 16px 0; justify-content: center; }
      .sidebar-link {
        justify-content: center;
        padding: 12px 0;
        border-left: none;
        border-bottom: 3px solid transparent;
      }
      .sidebar-link.active {
        border-bottom-color: transparent;
        border-left: 3px solid var(--blue);
      }
      .sidebar-link-bottom { border-top: 1px solid var(--bd); }
      .page-content {
        margin-left: 60px;
        padding-top: 0;
      }
    }

    /* Desktop ≥1024px: full 220px sidebar */
    @media (min-width: 1024px) {
      .sidebar { width: 220px; }
      .sidebar-wordmark,
      .sidebar-menu-label,
      .sidebar-link-text { display: inline; }
      .sidebar-header { padding: 20px 16px 16px; justify-content: flex-start; }
      .sidebar-link {
        justify-content: flex-start;
        padding: 11px 16px;
        border-left: 3px solid transparent;
        border-bottom: none;
      }
      .sidebar-link.active {
        border-left-color: var(--blue);
        border-bottom: none;
      }
      .page-content {
        margin-left: 220px;
        padding-top: 0;
      }
    }

    /* Toast container */
    #toast-container {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
    }

    .toast {
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13px;
      max-width: 320px;
      pointer-events: auto;
      animation: toast-in 0.2s ease;
    }

    .toast-success {
      background: rgba(34, 197, 94, 0.12);
      color: var(--green-text);
      border: 1px solid rgba(34, 197, 94, 0.2);
    }

    .toast-error {
      background: rgba(239, 68, 68, 0.12);
      color: var(--red-text);
      border: 1px solid rgba(239, 68, 68, 0.2);
    }

    @keyframes toast-in {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Scan button — Primary (topbar) */
    .scan-btn-primary {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 44px;
      padding: 0 18px;
      border-radius: 12px;
      border: none;
      background: var(--blue);
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity .15s, transform .1s;
      font-family: 'Inter', sans-serif;
      box-shadow: 0 1px 3px rgba(37,99,235,.3);
    }
    .scan-btn-primary:hover { opacity: .92; transform: translateY(-1px); }
    .scan-btn-primary[disabled] { pointer-events: none; opacity: 0.6; }

    /* Scan button — Secondary (per-workspace, per-campaign) per UI-SPEC */
    .scan-btn-secondary {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--bg-el);
      color: var(--tx1);
      font-size: 13px;
      font-weight: 400;
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid var(--bd);
      min-height: 44px;
      cursor: pointer;
      font-family: inherit;
      transition: background var(--transition), border-color var(--transition);
    }
    .scan-btn-secondary:hover { background: var(--bg-hov); border-color: var(--bd-s); }
    .scan-btn-secondary[disabled] { pointer-events: none; opacity: 0.6; }

    /* Spinner animation */
    @keyframes spin { to { transform: rotate(360deg); } }
    .spin-icon { animation: spin 0.8s linear infinite; }

    /* HTMX indicator: hidden by default, shown during request */
    .htmx-indicator { display: none; }
    .htmx-request .htmx-indicator,
    .htmx-request.htmx-indicator { display: inline-flex; }

    /* Health dot per UI-SPEC */
    .health-dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .health-dot--green { background: var(--green); }
    .health-dot--yellow { background: var(--amber); }
    .health-dot--red { background: var(--red); }
    .health-dot--gray { background: var(--tx3); }

    /* Breadcrumb bar per UI-SPEC */
    .breadcrumb-bar {
      padding: 16px 24px;
      background: var(--bg-el);
      border-bottom: 1px solid var(--bd);
      font-size: 13px;
      color: var(--tx3);
    }
    .breadcrumb-bar a { color: var(--blue); text-decoration: none; }
    .breadcrumb-bar a:hover { text-decoration: underline; }
    .breadcrumb-sep { color: var(--tx3); margin: 0 6px; }
    .breadcrumb-current { color: var(--tx1); }

    /* Status badge pills */
    .status-badge {
      display: inline-block;
      font-size: 13px;
      font-weight: 600;
      padding: 4px 8px;
      border-radius: 12px;
    }
    .status-badge--active {
      background: rgba(34,197,94,0.12);
      color: var(--green-text);
      border: 1px solid rgba(34,197,94,0.2);
    }
    .status-badge--draft {
      background: rgba(107,107,107,0.1);
      color: var(--tx2);
      border: 1px solid var(--bd);
    }

    /* Health pills (replaces dots on cards) */
    .pill { display: inline-flex; align-items: center; height: 24px; padding: 0 10px; border-radius: 6px; font-size: 11px; font-weight: 600; letter-spacing: .02em; }
    .pill-g { background: rgba(34,197,94,.08); color: var(--green-text); border: 1px solid rgba(34,197,94,.2); }
    .pill-a { background: rgba(245,158,11,.08); color: var(--amber-text); border: 1px solid rgba(245,158,11,.2); }
    .pill-r { background: rgba(239,68,68,.08); color: var(--red-text); border: 1px solid rgba(239,68,68,.2); }
    .pill-m { background: var(--bg-el); color: var(--tx3); border: 1px solid var(--bd); }
    .pill-blue { background: var(--blue-bg); color: var(--blue); border: 1px solid var(--blue-bd); }

    /* Summary chips (overview page) */
    .chips-wrap { padding: 20px 0 16px; }
    .chips { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    .chip { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--bd); background: var(--bg-el); font-size: 12px; color: var(--tx2); box-shadow: var(--sh); font-family: 'Inter', sans-serif; }
    .chip strong { color: var(--tx1); font-weight: 600; }
    .chip.c-red { border-color: rgba(239,68,68,.2); background: rgba(239,68,68,.04); color: var(--red-text); }
    .chip.c-amber { border-color: rgba(245,158,11,.2); background: rgba(245,158,11,.04); color: var(--amber-text); }
    .chip.c-green { border-color: rgba(34,197,94,.2); background: rgba(34,197,94,.04); color: var(--green-text); }
    .chip.c-blue { border-color: var(--blue-bg); background: var(--blue-bg); color: var(--blue); }
    .dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
    .dot-red { background: var(--red); }
    .dot-amber { background: var(--amber); }
    .dot-green { background: var(--green); }
    .dot-muted { background: var(--tx3); }

    /* Scanning card state */
    .ws-card.scanning {
      border-color: var(--blue);
      box-shadow: inset 4px 0 0 var(--blue), var(--sh);
      background: linear-gradient(90deg, var(--bg-el) 0%, rgba(37,99,235,.03) 50%, var(--bg-el) 100%);
      background-size: 200% 100%;
      animation: scan-shimmer 2s ease-in-out infinite;
    }
    @keyframes scan-shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
    .scan-card-spinner {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      flex-shrink: 0;
    }
    .pill-scanning {
      background: var(--blue-bg, rgba(39,86,247,.08));
      color: var(--blue);
      border: 1px solid rgba(39,86,247,.15);
    }

    /* Scan progress banner */
    .scan-banner {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      margin-bottom: 16px;
      border-radius: var(--radius);
      background: var(--blue-bg, rgba(39,86,247,.08));
      color: var(--blue);
      font-size: 13px;
      font-weight: 500;
      border: 1px solid rgba(39,86,247,.15);
    }

    /* Page shell per UI-SPEC */
    .page-shell {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px;
    }

    /* Utility: meta/label text */
    .text-meta { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: var(--tx3); font-weight: 600; font-family: 'Inter', sans-serif; }

    /* Freshness indicator */
    .freshness { font-size: 13px; }
    .freshness--green { color: var(--green-text); }
    .freshness--amber { color: var(--amber-text); }
    .freshness--gray { color: var(--tx3); }
  </style>
  {% block extra_styles %}{% endblock %}
</head>
<body>
  <!-- Mobile hamburger button -->
  <button class="sidebar-hamburger"
          id="sidebar-hamburger"
          aria-label="Open navigation"
          aria-expanded="false"
          aria-controls="sidebar">&#9776;</button>

  <!-- Dim backdrop for mobile overlay -->
  <div class="sidebar-backdrop" id="sidebar-backdrop" aria-hidden="true"></div>

  <!-- Sidebar navigation -->
  <aside class="sidebar" id="sidebar" aria-label="Main navigation">
    <a href="/monitoring" class="sidebar-header">
      <span class="logo-icon">
        <svg viewBox="0 0 24 24" fill="none"><path d="M12 2C8 7 4 10 4 14a8 8 0 0016 0c0-4-4-7-8-12z" fill="#fff"/></svg>
      </span>
      <span class="sidebar-wordmark">Prospeqt</span>
    </a>

    <div class="sidebar-menu-label">Menu</div>

    <nav>
      <a href="/monitoring"
         class="sidebar-link{% if active_tab == 'monitoring' %} active{% endif %}"
         data-tooltip="Monitoring"
         {% if active_tab == 'monitoring' %}aria-current="page"{% endif %}>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
        <span class="sidebar-link-text">Monitoring</span>
      </a>
      <a href="/qa"
         class="sidebar-link{% if active_tab == 'qa' %} active{% endif %}"
         data-tooltip="Email Check"
         {% if active_tab == 'qa' %}aria-current="page"{% endif %}>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline>
        </svg>
        <span class="sidebar-link-text">Email Check</span>
      </a>
    </nav>

    <div class="sidebar-spacer"></div>

    <a href="/admin/login"
       class="sidebar-link sidebar-link-bottom{% if active_tab == 'admin' %} active{% endif %}"
       data-tooltip="Settings"
       {% if active_tab == 'admin' %}aria-current="page"{% endif %}>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
      </svg>
      <span class="sidebar-link-text">Settings</span>
    </a>
  </aside>

  <main class="page-content">
    {% block content %}{% endblock %}
  </main>

  <div id="toast-container"></div>

  <script>
    // Hamburger toggle with focus trap and escape key
    (function () {
      var hamburger = document.getElementById('sidebar-hamburger');
      var sidebar = document.getElementById('sidebar');
      var backdrop = document.getElementById('sidebar-backdrop');

      // Viewport-aware inert/aria-hidden: only hide sidebar from AT on mobile when closed
      var mobileMQ = window.matchMedia('(max-width: 639px)');
      function syncMobileState() {
        if (mobileMQ.matches && !sidebar.classList.contains('open')) {
          sidebar.setAttribute('inert', '');
          sidebar.setAttribute('aria-hidden', 'true');
        } else {
          sidebar.removeAttribute('inert');
          sidebar.removeAttribute('aria-hidden');
        }
      }
      syncMobileState();
      mobileMQ.addEventListener('change', syncMobileState);

      function openSidebar() {
        sidebar.classList.add('open');
        backdrop.classList.add('open');
        hamburger.setAttribute('aria-expanded', 'true');
        sidebar.removeAttribute('aria-hidden');
        sidebar.removeAttribute('inert');
        // Move focus into sidebar
        var firstLink = sidebar.querySelector('a, button');
        if (firstLink) firstLink.focus();
      }

      function closeSidebar() {
        sidebar.classList.remove('open');
        backdrop.classList.remove('open');
        hamburger.setAttribute('aria-expanded', 'false');
        syncMobileState();
        hamburger.focus();
      }

      hamburger.addEventListener('click', function () {
        if (sidebar.classList.contains('open')) {
          closeSidebar();
        } else {
          openSidebar();
        }
      });

      // Close on backdrop click
      backdrop.addEventListener('click', closeSidebar);

      // Close on Escape
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && sidebar.classList.contains('open')) {
          closeSidebar();
        }
      });

      // Focus trap inside sidebar when open on mobile
      sidebar.addEventListener('keydown', function (e) {
        if (e.key !== 'Tab') return;
        if (!sidebar.classList.contains('open')) return; // guard: only trap when open
        if (window.innerWidth >= 640) return; // only trap on mobile
        var focusable = sidebar.querySelectorAll('a[href], button');
        var first = focusable[0];
        var last = focusable[focusable.length - 1];
        if (e.shiftKey) {
          if (document.activeElement === first) { e.preventDefault(); last.focus(); }
        } else {
          if (document.activeElement === last) { e.preventDefault(); first.focus(); }
        }
      });
    })();

    function showToast(message, type) {
      type = type || 'success';
      var container = document.getElementById('toast-container');
      var toast = document.createElement('div');
      toast.className = 'toast toast-' + type;
      toast.textContent = message;
      container.appendChild(toast);
      setTimeout(function() {
        toast.style.opacity = '0';
        toast.style.transition = 'opacity 0.2s';
        setTimeout(function() {
          if (toast.parentNode) toast.parentNode.removeChild(toast);
        }, 200);
      }, 3000);
    }

    document.body.addEventListener('htmx:responseError', function(evt) {
      showToast('Something went wrong. Refresh the page or try the scan again.', 'error');
    });

    // Show toast when scan buttons are clicked
    document.body.addEventListener('htmx:beforeRequest', function(evt) {
      var path = evt.detail.pathInfo && evt.detail.pathInfo.requestPath || '';
      if (path.indexOf('/qa/api/scan') !== -1 || path.indexOf('/api/scan') === 0) {
        showToast('Scan started — results will appear shortly...', 'success');
      }
    });
  </script>
  {% block extra_scripts %}{% endblock %}
</body>
</html>
