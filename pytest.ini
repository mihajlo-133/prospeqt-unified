[pytest]
asyncio_mode = auto
testpaths = tests
# e2e tests use Playwright sync API which conflicts with pytest-asyncio's event loop.
# Run them separately: pytest tests/e2e/ -v
# Run unit tests separately: pytest tests/ --ignore=tests/e2e -q
addopts = --ignore=tests/e2e
markers =
    e2e: Playwright end-to-end browser tests (run separately: pytest tests/e2e/)
